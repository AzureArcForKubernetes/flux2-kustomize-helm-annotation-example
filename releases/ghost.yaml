---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ghost
  namespace: demo
  annotations:
    fluxcd.io/automated: "false"
    clusterconfig.azure.com/use-managed-source: "true"
spec:
  interval: 10m
  releaseName: ghost
  chart:
    spec:
      chart: charts/podinfo
  values:
    image:
      repository: azurearcfork8sdev.azurecr.io/flux-test-dependencies/stefanprodan/podinfo
      tag: "4.0.6"
    replicaCount: 1
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
    service:
      type: ClusterIP
